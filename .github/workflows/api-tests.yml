name: API Tests

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      
      - name: Install Newman and Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra
      
      - name: Run API Tests
        id: run-tests
        run: |
          newman run ./postman/jsonplaceholder-tests.json \
            --reporters cli,htmlextra,json \
            --reporter-htmlextra-export ./newman/report.html \
            --reporter-json-export ./newman/report.json
        continue-on-error: true
      
      - name: Save Test Results
        uses: actions/upload-artifact@v3
        with:
          name: newman-test-results
          path: ./newman
      
      - name: Parse Test Results for PR Comment
        id: parse-results
        run: |
          TOTAL=$(jq '.run.stats.requests.total' ./newman/report.json)
          FAILED=$(jq '.run.stats.requests.failed' ./newman/report.json)
          PASSED=$((TOTAL - FAILED))
          TEST_TOTAL=$(jq '.run.stats.assertions.total' ./newman/report.json)
          TEST_FAILED=$(jq '.run.stats.assertions.failed' ./newman/report.json)
          TEST_PASSED=$((TEST_TOTAL - TEST_FAILED))
          
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "test_total=$TEST_TOTAL" >> $GITHUB_OUTPUT
          echo "test_failed=$TEST_FAILED" >> $GITHUB_OUTPUT
          echo "test_passed=$TEST_PASSED" >> $GITHUB_OUTPUT
          
          # Create markdown summary
          echo "### API Test Results" > $GITHUB_STEP_SUMMARY
          echo "✅ **Requests**: $PASSED passed, $FAILED failed (total: $TOTAL)" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Tests**: $TEST_PASSED passed, $TEST_FAILED failed (total: $TEST_TOTAL)" >> $GITHUB_STEP_SUMMARY
          
          # For PR comment
          echo "summary=✅ **API Tests**: $TEST_PASSED/$TEST_TOTAL tests passed across $TOTAL requests" >> $GITHUB_OUTPUT
      
      - name: Find Comment
        uses: peter-evans/find-comment@v2
        if: github.event_name == 'pull_request'
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: API Test Results
      
      - name: Create or Update Comment
        uses: peter-evans/create-or-update-comment@v2
        if: github.event_name == 'pull_request'
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## API Test Results
            ${{ steps.parse-results.outputs.summary }}
            
            <details>
            <summary>View Details</summary>
            
            - **Requests**: ${{ steps.parse-results.outputs.passed }} passed, ${{ steps.parse-results.outputs.failed }} failed (total: ${{ steps.parse-results.outputs.total }})
            - **Tests**: ${{ steps.parse-results.outputs.test_passed }} passed, ${{ steps.parse-results.outputs.test_failed }} failed (total: ${{ steps.parse-results.outputs.test_total }})
            
            [View full HTML report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            </details>
          edit-mode: replace
          
      - name: Check Test Status
        if: steps.run-tests.outcome == 'failure'
        run: exit 1