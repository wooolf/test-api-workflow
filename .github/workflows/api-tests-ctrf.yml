name: API Test Status Demo

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      
      - name: Install Newman and Reporters
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra
          npm install -g newman-reporter-ctrf-json
      
      - name: Create Directories
        run: |
          mkdir -p ./newman
          mkdir -p ./ctrf
      
      - name: Find all Postman Collections
        id: find-collections
        run: |
          # Find all .json files in the tests/collections folder
          COLLECTIONS=$(find ./tests/collections -name "*.json" -type f | tr '\n' ' ')
          echo "collections=$COLLECTIONS" >> $GITHUB_OUTPUT
          echo "Found collections: $COLLECTIONS"
      
      - name: Run Newman Tests for All Collections
        run: bash ./tests/scripts/run-collections.sh ${{ steps.find-collections.outputs.collections }}
        continue-on-error: true
      
      - name: Process Reports to Identify Flaky Tests and Other Statuses
        run: node ./tests/scripts/combine-reports.js
      
      - name: Save Test Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ./newman/
            ./ctrf/
      
      # Using the GitHub Test Reporter to show various report types
      - name: Publish Test Status Summary
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: './ctrf/combined-report.json'
          summary-report: true
          test-report: true
          failed-report: true
          flaky-report: true
          skipped-report: true
        if: always()
      
      # Add detailed report to PR comment
      - name: Publish Test Status Report to PR
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: './ctrf/combined-report.json'
          pull-request: true
          pull-request-report: true
          summary-report: false
          test-report: false
          failed-report: true
          flaky-report: true
          skipped-report: true
          title: 'API Test Results'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always() && github.event_name == 'pull_request'