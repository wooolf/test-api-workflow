name: API Tests with CTRF Test Reporter

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Add permissions needed for PR comments
permissions:
  contents: read
  pull-requests: write

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      
      - name: Install Newman, Reporters and CTRF Test Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra
          npm install -g newman-reporter-ctrf-json
          npm install -g @ctrf/github-test-reporter
      
      - name: Create Directories
        run: |
          mkdir -p ./tests/collections
          mkdir -p ./newman
          mkdir -p ./ctrf

      - name: Find Collection Files
        id: find-collections
        run: |
          echo "collections=$(find ./tests/collections -name "*.json" -type f | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> $GITHUB_OUTPUT
      
      - name: Run API Tests with CTRF Reporter
        id: run-tests
        run: |
          # Read collections from find step
          COLLECTIONS='${{ steps.find-collections.outputs.collections }}'
          
          # Process each collection
          echo $COLLECTIONS | jq -c '.[]' | while read -r collection; do
            # Remove quotes from the collection path
            collection=$(echo $collection | tr -d '"')
            # Extract just the filename without path and extension
            collection_name=$(basename "$collection" .json)
            
            echo "Running tests for collection: $collection_name"
            
            # Create directory for this collection's reports
            mkdir -p "./newman/$collection_name"
            mkdir -p "./ctrf/$collection_name"
            
            # Run Newman with collection-specific output paths
            newman run "$collection" \
              --reporters cli,htmlextra,ctrf-json \
              --reporter-htmlextra-export "./newman/$collection_name/report.html" \
              --reporter-ctrf-json-output-dir "./ctrf/$collection_name" \
              --reporter-ctrf-json-output-file "ctrf-report.json" \
              --reporter-ctrf-json-build-name "API Tests - $collection_name" \
              --reporter-ctrf-json-app-name "API Testing Workflow" || true
          done
        shell: bash
      
      - name: Save Test Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ./newman/
            ./ctrf/
      
      # Generate separate reports for each collection
      - name: Publish Individual Collection Test Reports
        id: publish-reports
        run: |
          # Find all collection directories
          for collection_dir in ./ctrf/*/; do
            collection_name=$(basename "$collection_dir")
            echo "Publishing report for collection: $collection_name"
            
            # Create report for this collection
            {
              echo "## Test Results: $collection_name"
              echo ""
              echo "---"
            } >> $GITHUB_STEP_SUMMARY
            
            # Run CTRF reporter for this specific collection
            ctrf_report_path="./ctrf/$collection_name/ctrf-report.json"
            
            github-test-reporter \
              --report-path="$ctrf_report_path" \
              --summary-report=true \
              --test-report=true \
              --failed-report=true \
              --title="$collection_name Tests" \
              --output-file="./ctrf/$collection_name/summary.md"
            
            # Append the generated summary to GitHub step summary
            cat "./ctrf/$collection_name/summary.md" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done
        shell: bash
        if: always()
      
      # Post individual results to PR comment for each collection
      - name: Publish Collection Reports to PR
        id: publish-pr
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Find all collection directories
            for collection_dir in ./ctrf/*/; do
              collection_name=$(basename "$collection_dir")
              echo "Publishing PR comment for collection: $collection_name"
              
              # Create PR comment for this collection
              ctrf_report_path="./ctrf/$collection_name/ctrf-report.json"
              
              github-test-reporter \
                --report-path="$ctrf_report_path" \
                --pull-request-report=true \
                --pull-request=true \
                --title="$collection_name Tests"
            done
          fi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always() && github.event_name == 'pull_request'