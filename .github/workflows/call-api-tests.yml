# .github/workflows/call-api-tests.yml
name: Run API Tests via Reusable Workflow

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_api:
    name: Execute API Tests
    uses: wooolf/test-api-workflow/.github/workflows/reusable-api-tests.yml@feature/api-testing
    with:
      collections-path: './tests/collections'
      node-version: '18'
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

